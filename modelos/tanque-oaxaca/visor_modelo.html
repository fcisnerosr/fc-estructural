    var NP = pm.P_fuerte.length;

    var NT = 36;

    } else if(tipo === 'vigx' || tipo === 'vigy') {

        +'Plotly.react("dM",[{x:c.xd,y:c.Md,type:"scatter",mode:"lines",fill:"tozeroy",fillcolor:"rgba(56,142,60,.15)",line:{color:"#388E3C",width:2.5}}],lay("M — Momento flexionante","M [ton-f·m]"),{responsive:true});}',
      ('function svgArmado(V){'

        +'function TX(x,y,a,fs,col,txt,fw){return "<text x="+Q+x+Q+" y="+Q+y+Q+" text-anchor="+Q+a+Q+" font-size="+Q+fs+Q+" fill="+Q+col+Q+" font-weight="+Q+(fw||"normal")+Q+">"+txt+"</text>";}'

        +'P.push(R(X0-cw,yT-30,cw,yB-yT+60,"#CFD8DC","#78909C"));'
