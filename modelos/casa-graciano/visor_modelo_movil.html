  /* Botón modo oscuro */
  var dark=false;
  var origAnnColors=null, origMenuBg=null, origMenuFc=null, origMenuActive=null;

  var barra=document.createElement('div');
  barra.style.cssText='position:fixed;top:5px;right:5px;z-index:9999;display:flex;gap:5px;';
  document.body.appendChild(barra);
  var _ESTILO_BTN='width:40px;height:40px;display:flex;align-items:center;'
    +'justify-content:center;border-radius:9px;cursor:pointer;font-size:17px;'
    +'text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.28);padding:0;';

  var btn=document.createElement('button');
  btn.innerHTML='🌙'; btn.title='Modo oscuro / claro';
  btn.style.cssText=_ESTILO_BTN+'border:1px solid #bbb;background:#f0f0f0;';
  barra.appendChild(btn);

  btn.addEventListener('click',function(){
    dark=!dark;
    document.body.classList.toggle('viz-dark', dark);   /* overlays HTML → modo oscuro */
    var layout=gd.layout;

    /* Capturar valores originales en el primer click */
    if(origAnnColors===null){
      origAnnColors=(layout.annotations||[]).map(function(a){
        return (a.font&&a.font.color)?a.font.color:'#333333';
      });
      origMenuBg=(layout.updatemenus||[]).map(function(m){
        return m.bgcolor||'#eaeaea';
      });
      origMenuFc=(layout.updatemenus||[]).map(function(m){
        return (m.font&&m.font.color)?m.font.color:'#000000';
      });
      origMenuActive=(layout.updatemenus||[]).map(function(m){
        return (m.active!=null)?m.active:-1;
      });
    }

    var rl={};
    if(dark){
      /* Fondos y ejes */
      Object.assign(rl,{
        'paper_bgcolor':'#1a1a2e','scene.bgcolor':'#16213e',
        'scene.xaxis.color':'#aaa','scene.yaxis.color':'#aaa','scene.zaxis.color':'#aaa',
        'scene.xaxis.gridcolor':'#334','scene.yaxis.gridcolor':'#334','scene.zaxis.gridcolor':'#334',
        'legend.font.color':'#ddd','legend.bgcolor':'rgba(20,20,50,0.92)','legend.bordercolor':'#446'
      });
      /* Botones: fondo oscuro + texto claro.
         active=-1 quita el resaltado blanco de Plotly (que haría invisible el texto claro) */
      (layout.updatemenus||[]).forEach(function(_,i){
        rl['updatemenus['+i+'].bgcolor']='#2d2d4e';
        rl['updatemenus['+i+'].font.color']='#e0e0e0';
        rl['updatemenus['+i+'].bordercolor']='#445';
        rl['updatemenus['+i+'].active']=-1;
      });
      /* Anotaciones: texto claro */
      (layout.annotations||[]).forEach(function(_,j){
        rl['annotations['+j+'].font.color']='#bbb';
      });
      Plotly.relayout(gd,rl);
      /* Trazas estructurales */
      Plotly.restyle(gd,{color:DARK_COL,opacity:0.9},[0]);
      Plotly.restyle(gd,{color:DARK_VX, opacity:0.9},[1]);
      Plotly.restyle(gd,{color:DARK_VY, opacity:0.9},[2]);
      Plotly.restyle(gd,{'line.color':DARK_COL},[3]);
      Plotly.restyle(gd,{'line.color':DARK_VX}, [4]);
      Plotly.restyle(gd,{'line.color':DARK_VY}, [5]);
      if(LOSA_IDX>=0){Plotly.restyle(gd,{color:DARK_LOSA,opacity:0.5},[LOSA_IDX]);}
      /* UI */
      document.body.style.background='#1a1a2e';
      btn.style.background='#2a2a4e'; btn.style.color='#fff'; btn.style.borderColor='#446';
      btn.innerHTML='☀️';
    }else{
      /* Restaurar fondos y ejes */
      Object.assign(rl,{
        'paper_bgcolor':'white','scene.bgcolor':'#f8f8f8',
        'scene.xaxis.color':null,'scene.yaxis.color':null,'scene.zaxis.color':null,
        'scene.xaxis.gridcolor':null,'scene.yaxis.gridcolor':null,'scene.zaxis.gridcolor':null,
        'legend.font.color':null,'legend.bgcolor':'rgba(255,255,255,0.85)','legend.bordercolor':'#cccccc'
      });
      /* Restaurar botones (incluyendo active para recuperar resaltado) */
      (origMenuBg||[]).forEach(function(bg,i){
        rl['updatemenus['+i+'].bgcolor']=bg;
        rl['updatemenus['+i+'].font.color']=origMenuFc[i];
        rl['updatemenus['+i+'].bordercolor']='#aaaaaa';
        rl['updatemenus['+i+'].active']=(origMenuActive||[])[i]||-1;
      });
      /* Restaurar anotaciones */
      (origAnnColors||[]).forEach(function(c,j){
        rl['annotations['+j+'].font.color']=c;
      });
      Plotly.relayout(gd,rl);
      /* Restaurar trazas */
      Plotly.restyle(gd,{color:LIGHT_COL,opacity:0.82},[0]);
      Plotly.restyle(gd,{color:LIGHT_VX, opacity:0.82},[1]);
      Plotly.restyle(gd,{color:LIGHT_VY, opacity:0.82},[2]);
      Plotly.restyle(gd,{'line.color':LIGHT_COL},[3]);
      Plotly.restyle(gd,{'line.color':LIGHT_VX}, [4]);
      Plotly.restyle(gd,{'line.color':LIGHT_VY}, [5]);
      if(LOSA_IDX>=0){Plotly.restyle(gd,{color:LIGHT_LOSA,opacity:0.18},[LOSA_IDX]);}
      /* UI */
      document.body.style.background='';
      btn.style.background='#f0f0f0'; btn.style.color='#000'; btn.style.borderColor='#bbb';
      btn.innerHTML='🌙';
    }
  });

  /* Seguir el tema del teléfono: si el usuario trae el modo oscuro activado en
     iOS/Android, el visor abre en oscuro. Se dispara el mismo botón para no
     duplicar la lógica de recoloreo (que además captura los valores originales
     en su primer click, necesarios para poder volver a claro). */
  try{
    var _mq = window.matchMedia('(prefers-color-scheme: dark)');
    if(_mq.matches){ btn.click(); }
    var _alTemaCambiar = function(ev){ if(ev.matches !== dark){ btn.click(); } };
    if(_mq.addEventListener){ _mq.addEventListener('change', _alTemaCambiar); }
    else if(_mq.addListener){ _mq.addListener(_alTemaCambiar); }   /* iOS < 14 */
  }catch(e){}

  var btnModos=document.createElement('a');

  btnModos.innerHTML='Formas<br>modales';

  btnModos.style.cssText=_ESTILO_BTN

  barra.appendChild(btnModos);

  (function(){

    var d0=null, eye0=null, raf=null, destino=null, R0=null;

    function camaraActual(){
      var sc  = gd._fullLayout && gd._fullLayout.scene;
      var cam = (sc && sc.camera) || ((gd.layout.scene||{}).camera);
      return (cam && cam.eye) ? cam.eye : null;
    }
    function separacion(t){
      var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
      return Math.sqrt(dx*dx+dy*dy);
    }
    function norma(e){ return Math.sqrt(e.x*e.x+e.y*e.y+e.z*e.z); }

    /* Distancia de referencia = la vista con la que abrió la página. Se toma
       tras el primer render, cuando Plotly ya resolvió la cámara real. */
    setTimeout(function(){ var e=camaraActual(); if(e){ R0=norma(e); } }, 400);

      if(ev.touches.length!==2) return;

      if(R0===null){ R0=norma(e); }
      d0=separacion(ev.touches);
      eye0={x:e.x, y:e.y, z:e.z};
      ev.preventDefault();
    }, {passive:false});

      var k = d0/d;                       /* dedos separandose -> k<1 -> acercar */
      if(R0){
        var r = norma(eye0)*k/R0;
        if(r < R_MIN)      k *= R_MIN/r;
        else if(r > R_MAX) k *= R_MAX/r;

      destino = {x:eye0.x*k, y:eye0.y*k, z:eye0.z*k};

        raf = requestAnimationFrame(function(){
          raf = null;
          if(destino){ Plotly.relayout(gd, {'scene.camera.eye': destino}); }
        });
      }
    }, {passive:false});

      if(!ev.touches || ev.touches.length<2){ d0=null; eye0=null; }
    }
    gd.addEventListener('touchend', soltar);
