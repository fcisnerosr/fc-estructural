  (function(){

    var d0=null, eye0=null, raf=null, destino=null, R0=null;

    function camaraActual(){
      var sc  = gd._fullLayout && gd._fullLayout.scene;
      var cam = (sc && sc.camera) || ((gd.layout.scene||{}).camera);
      return (cam && cam.eye) ? cam.eye : null;
    }
    function separacion(t){
      var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
      return Math.sqrt(dx*dx+dy*dy);
    }
    function norma(e){ return Math.sqrt(e.x*e.x+e.y*e.y+e.z*e.z); }

    /* Distancia de referencia = la vista con la que abrió la página. Se toma
       tras el primer render, cuando Plotly ya resolvió la cámara real. */
    setTimeout(function(){ var e=camaraActual(); if(e){ R0=norma(e); } }, 400);

      if(!e) return;
