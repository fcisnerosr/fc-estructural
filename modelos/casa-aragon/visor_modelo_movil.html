  (function(){
    var R_MIN=0.30, R_MAX=3.20;
    var d0=null, eye0=null, raf=null, destino=null, R0=null;

    function camaraActual(){
      var sc  = gd._fullLayout && gd._fullLayout.scene;
      var cam = (sc && sc.camera) || ((gd.layout.scene||{}).camera);
      return (cam && cam.eye) ? cam.eye : null;
    }
    function separacion(t){
      var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
      return Math.sqrt(dx*dx+dy*dy);
    }
    function norma(e){ return Math.sqrt(e.x*e.x+e.y*e.y+e.z*e.z); }

    /* Distancia de referencia = la vista con la que abrió la página. Se toma
       tras el primer render, cuando Plotly ya resolvió la cámara real. */
    setTimeout(function(){ var e=camaraActual(); if(e){ R0=norma(e); } }, 400);

      if(ev.touches.length!==2) return;
      var e=camaraActual();
      if(!e) return;
      if(R0===null){ R0=norma(e); }
      d0=separacion(ev.touches);
      eye0={x:e.x, y:e.y, z:e.z};

    var html2d = [

  function sinMargen(){ Plotly.relayout(gd, margenes()); Plotly.Plots.resize(gd); }
  window.addEventListener('resize', sinMargen);    /* después de cualquier ajuste propio del visor */
  if(window.innerWidth < 980) document.body.classList.add('tb-sin-panel');

  /* ── Acciones ────────────────────────────────────────────────────────── */
  function aplicar(im, j){
    var m = ums()[im], b = m && m.buttons[j];
    if(!b) return;
    var a = copia(b.args || []);
    if(b.method === 'relayout') Plotly.relayout(gd, a[0]);
    else if(b.method === 'update') Plotly.update(gd, a[0], a[1], a[2]);
    else if(b.method === 'animate') Plotly.animate(gd, a[0], a[1]);
    else Plotly.restyle(gd, a[0], a[1]);
    var r = {}; r['updatemenus['+im+'].active'] = j;
    Plotly.relayout(gd, r);
  }
  function activo(m){ return m.active == null ? 0 : m.active; }   /* Plotly: botones sin `active` = 0 */
  function modoModelo(){
    if(D.menu_modelo == null || !ums()[D.menu_modelo]) return 0;
    var a = ums()[D.menu_modelo].active; return a == null ? 0 : a;
  }
  function visible(i){ var v = (gd.data[i]||{}).visible; return v===undefined || v===true; }
  function idxCapa(c){ return c.modo ? c.modo.mesh.concat(c.modo.eje) : c.idx; }
  function ponerCapa(c, on){
    if(!on){ Plotly.restyle(gd, {visible:false}, idxCapa(c)); return; }
    if(!c.modo){ Plotly.restyle(gd, {visible:true}, c.idx); return; }
    var modo = modoModelo();                       /* 0 extruido · 1 eje neutro · 2 ambos */
    if(c.modo.mesh.length) Plotly.restyle(gd, {visible: modo !== 1}, c.modo.mesh);
    if(c.modo.eje.length)  Plotly.restyle(gd, {visible: modo !== 0}, c.modo.eje);
  }
  function restaurar(){
    Plotly.restyle(gd, {visible: INIT_VIS.slice(), opacity: INIT_OPA.slice()});
    var r = {};
    INIT_ACT.forEach(function(a, i){ r['updatemenus['+i+'].active'] = a; });
    if(INIT_AR) r['scene.aspectratio'] = copia(INIT_AR);
    if(INIT_EJES) for(var k in INIT_EJES) if(INIT_EJES[k] != null) r[k] = copia(INIT_EJES[k]);
    var cam = vista(D.camara_inicial) || INIT_CAM;
    if(cam){ r['scene.camera'] = copia(cam); camPropia = true; }
    vistaActual = D.camara_inicial || '';
    Plotly.relayout(gd, r);
    if(ACC.__restaurar) ACC.__restaurar();
  }
  function cerrarPops(){ todos('.tb-herr.tb-abierta').forEach(function(n){ n.classList.remove('tb-abierta'); }); }

  document.addEventListener('click', function(ev){
    var t = ev.target;
    if(!t || !t.closest) return;
    var seg = t.closest('.tb-seg button'), capa = t.closest('.tb-capa input'), vis = t.closest('[data-vista]'),
        acc = t.closest('[data-acc]'), accion = t.closest('[data-accion]'), herrBtn = t.closest('.tb-herr > button');
    if(seg){ aplicar(+seg.dataset.menu, +seg.dataset.j); return; }
    if(capa){ ponerCapa(D.capas[+capa.closest('.tb-capa').dataset.capa], capa.checked); return; }
    if(vis){ vistaActual = vis.dataset.vista; camPropia = true; Plotly.relayout(gd, {'scene.camera': vista(vistaActual)}); refrescar(); return; }
    if(accion){ cerrarPops(); if(ACC[accion.dataset.accion]) ACC[accion.dataset.accion](accion); refrescar(); return; }
    if(acc){
      var a = acc.dataset.acc;
      if(a==='panel'){ document.body.classList.toggle('tb-sin-panel'); setTimeout(function(){ Plotly.Plots.resize(gd); }, 280); }
      else if(a==='completa'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
      else if(a==='guia' && btnGuia){ btnGuia.click(); }
      else if(a==='restaurar'){ restaurar(); }
      return;
    }
    if(herrBtn){
      var h = herrBtn.parentNode, abierta = h.classList.contains('tb-abierta');
      cerrarPops();
      if(!abierta && h.querySelector('.tb-pop')) h.classList.add('tb-abierta');
      refrescar();
      return;
    }
    if(!t.closest('.tb-pop')){ cerrarPops(); refrescar(); }
  });

  /* ── Sincroniza el tablero con el estado real de la figura ───────────── */
  function refrescar(){
    todos('.tb-seg button').forEach(function(b){
      var m = ums()[+b.dataset.menu];
      b.classList.toggle('tb-activo', !!m && activo(m) === +b.dataset.j);
    });
    todos('.tb-herr').forEach(function(h){
      var btn = h.firstChild;
      if(!btn || btn.tagName !== 'BUTTON') return;
      if(btn.dataset.accion){
        var est = ESTADO[btn.dataset.accion];
        var on = !!(est && est());
        btn.classList.toggle('tb-on', on);
        return;
      }
      var usado = (h._filas||[]).some(function(f){
        if(f.apagado == null) return false;
        var m = ums()[f.menu]; return !!m && activo(m) !== f.apagado;
      });
      btn.classList.toggle('tb-on', h.classList.contains('tb-abierta') || usado);
    });
    var n = 0;
    todos('.tb-capa').forEach(function(l){
      var on = idxCapa(D.capas[+l.dataset.capa]).some(visible);
      if(on) n++;
      l.querySelector('input').checked = on;
      l.classList.toggle('tb-apagada', !on);
      l.querySelector('.tb-est').innerHTML = on ? svg(I.ojo)+'Visible' : svg(I.ojoNo)+'Oculto';
    });
    var cuenta = tCapas && tCapas.querySelector('.tb-cuenta');
    if(cuenta) cuenta.textContent = n+'/'+D.capas.length+' visibles';
    todos('[data-vista]').forEach(function(b){ b.classList.toggle('tb-activo', b.dataset.vista === vistaActual); });
    if(ACC.__refrescar) ACC.__refrescar();
  }
  gd.on('plotly_restyle', refrescar);
  gd.on('plotly_relayout', function(ev){
    var cam = ev && Object.keys(ev).some(function(k){ return k.indexOf('scene.camera')===0; });
    if(cam){ if(camPropia) camPropia = false; else vistaActual = ''; }   /* giro con el mouse */
    refrescar();
  });

  /* ── Código propio del visor. API: gd, D, ACC, ESTADO, svg, I, el, esc, todos,
        refrescar, lienzo, panel, barra ────────────────────────────────────── */
  

  refrescar();
})();

                        })                };            </script>        </div>
